name: build

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every push compiles, so a broken copy path never reaches a release tag.
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build QuickNote/QuickNote.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish QuickNote/QuickNote.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish/* -DestinationPath "QuickNote-$version-win-x64.zip"
          "PACKAGE=QuickNote-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ env.PACKAGE }}" \
            --title "QuickNote ${{ github.ref_name }}" --generate-notes ||
          gh release upload "${{ github.ref_name }}" "${{ env.PACKAGE }}" --clobber
