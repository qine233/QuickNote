name: build

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every push compiles, so a broken copy path never reaches a release tag.
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build QuickNote/QuickNote.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish QuickNote/QuickNote.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish/* -DestinationPath "QuickNote-$version-win-x64.zip"
          "PACKAGE=QuickNote-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # bash, not pwsh: PowerShell reads the continued "--title" line as the
      # range operator and aborts with "Missing expression after unary operator".
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${PACKAGE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" \
              --title "QuickNote ${GITHUB_REF_NAME}" --generate-notes
          fi
